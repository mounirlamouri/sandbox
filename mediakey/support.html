<!DOCTYPE html>
<html>
<head>
<style>
  details > details {
    padding-left: 10px;
  }
  details > details > div {
    padding-left: 10px;
  }
</style>
</head>
<body>
</body>
<script>
  const keySystems = [
    "com.widevine.alpha",
    //"com.apple.fairplay",
  ];
  const sessionTypes = [
    'persistent-license',
    'temporary',
  ]
  const L3config = [{
    videoCapabilities: [{
      contentType: 'video/webm; codecs="vp09.00.10.08"',
      robustness: 'SW_SECURE_DECODE' // Widevine L3
    }]
  }];
  const L1config = [{
    videoCapabilities: [{
      contentType: 'video/webm; codecs="vp09.00.10.08"',
      robustness: 'HW_SECURE_ALL' // Widevine L1
    }]
  }];

  keySystems.forEach(keySystem => {
    let keySystemBlock = document.createElement('details');
    keySystemBlock.open = true;
    let summary = document.createElement('summary');
    summary.textContent = 'keySystem: ' + keySystem;
    keySystemBlock.appendChild(summary);

    sessionTypes.forEach(sessionType => {
      let sessionTypeBlock = document.createElement('details');
      sessionTypeBlock.open = true;
      let summary = document.createElement('summary');
      summary.textContent = 'sessionType: ' + sessionType;
      sessionTypeBlock.appendChild(summary);

      let config = L3config;
      config.sessionTypes = [ sessionType ];
      navigator.requestMediaKeySystemAccess(keySystem, config)
        .then(access => { return true; })
        .catch(error => { return false; })
        .then(v => {
            let d = document.createElement('div');
            d.textContent = "Software (aka L3) support: " + v;
            sessionTypeBlock.appendChild(d);
        });

      navigator.requestMediaKeySystemAccess(keySystem, config)
        .then(access => { return true; })
        .catch(error => { return false; })
        .then(v => {
            let d = document.createElement('div');
            d.textContent = "Hardware (aka L1) support: " + v;
            sessionTypeBlock.appendChild(d);
        });

      keySystemBlock.appendChild(sessionTypeBlock);
    });

    document.body.appendChild(keySystemBlock);
  });

</script>
</html>

<!DOCTYPE html>
<html>
<head>
	<title>Gamepad Button Latency</title>
	<style>
		body {
			background-color: white;
		}
	</style>
</head>
<body>
</body>
<script>
    let gamepad = null;
    let isBlack = false;
    let buttonsPressed = null;

    window.addEventListener('gamepadconnected', (event) => {
        gamepad = event.gamepad;
    });

    window.addEventListener('gamepaddisconnected', () => {
        gamepad = null;
    });

    function setButtons() {
        for (let i = 0; i < gamepad.buttons.length; ++i) {
            buttonsPressed[i] = gamepad.buttons[i].pressed;
        }
    }

    function haveButtonsChanged() {
        for (let i = 0; i < gamepad.buttons.length; ++i) {
            if (buttonsPressed[i] != gamepad.buttons[i].pressed)
                return true;
        }
        return false;
    }

    function runRAFUpdate() {
        requestAnimationFrame(update);
    }

    function update() {
        // No gamepads yet.
        if (!gamepad)
            return runRAFUpdate();

        if (buttonsPressed == null) {
            buttonsPressed = new Array(gamepad.buttons.length);
            setButtons();
            return runRAFUpdate();
        }

        // State hasn't changed.
        if (!haveButtonsChanged())
            return runRAFUpdate();

        setButtons();

        if (isBlack) {
            document.body.style.backgroundColor = 'white';
            isBlack = false;
        } else {
            document.body.style.backgroundColor = 'black';
            isBlack = true;
        }

        runRAFUpdate();
    }

    update();
</script>
</html>

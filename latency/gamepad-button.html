<!DOCTYPE html>
<html>
<head>
	<title>Gamepad Button Latency</title>
	<style>
		body {
			background-color: white;
		}
	</style>
</head>
<body>
</body>
<script>
    let gamepad = null;
    let buttonsPressed = null;

    window.addEventListener('gamepadconnected', (event) => {
        gamepad = event.gamepad;

        // Initialise the buttons pressed object.
        buttonsPressed = new Array(gamepad.buttons.length);
        setButtons();

        runRAFUpdate();
    });

    window.addEventListener('gamepaddisconnected', () => {
        gamepad = null;
        // It will stop the updates.
    });

    function setButtons() {
        for (let i = 0; i < gamepad.buttons.length; ++i) {
            buttonsPressed[i] = gamepad.buttons[i].pressed;
        }
    }

    function haveButtonsChanged() {
        for (let i = 0; i < gamepad.buttons.length; ++i) {
            if (buttonsPressed[i] != gamepad.buttons[i].pressed)
                return true;
        }
        return false;
    }

    function oneButtonPressed() {
        for (let i = 0; i < buttonsPressed.length; ++i) {
            if (buttonsPressed[i])
                return true;
        }
        return false;
    }

    function runRAFUpdate() {
        requestAnimationFrame(update);
    }

    function update() {
        // No more gamepads. We shouldn't be in this state before one is
        // connected.
        if (!gamepad)
            return;

        // Update the snapshot.
        gamepad = navigator.getGamepads()[0];

        // State hasn't changed.
        if (!haveButtonsChanged())
            return runRAFUpdate();

        setButtons();

        document.body.style.backgroundColor = oneButtonPressed() ? 'black' : 'white';

        runRAFUpdate();
    }
</script>
</html>
